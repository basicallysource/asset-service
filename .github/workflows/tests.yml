name: Tests

# Runs on its own for a branch or a pull request, and is called by the release
# workflow so that what ships is what was tested -- one definition, not two.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # ffmpeg, because the image ships with it and the video tests skip
      # themselves without it -- a suite that silently tests less than what
      # runs is worse than one that takes an extra minute.
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet -tags nodynamic ./...

      # The race detector, because the one place concurrency matters here --
      # two uploads of the same bytes at once -- is meant to be safe by design.
      # nodynamic everywhere, because that is what ships: without it the WebP
      # encoder dlopens a system libwebp, and the tests would exercise a code
      # path the image never runs.
      - name: Test
        run: go test -race -tags nodynamic ./...

      - name: Build
        run: go build -tags nodynamic ./...
