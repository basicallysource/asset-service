name: Release

# Every merge to main ships. The version number is derived, not chosen: the
# next patch above the highest tag. Nothing is hand-tagged, so nothing is
# forgotten or skipped, and the tag names exactly what was built.
#
# Order matters: tests, then the image, then the tag and the release. A release
# that exists is therefore always one whose image is in the registry and whose
# tests passed -- which is what lets a host install a release without asking
# any further questions.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'agent-docs/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive the next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            rest="${latest#v}"
            major="${rest%%.*}"; rest="${rest#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Releasing $next"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: that is what the hosts running this are. Building
      # arm64 as well would double the build for an image nothing pulls.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A host installs by digest, so the release carries one as data rather
      # than as prose something downstream would have to parse.
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          jq -n \
            --arg version "$VERSION" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg commit "$GITHUB_SHA" \
            '{version: $version, image: $image, digest: $digest, commit: $commit}' \
            > release.json
          cat release.json

          {
            printf 'Image: `%s:%s`\n' "$IMAGE" "$VERSION"
            printf 'Digest: `%s`\n' "$DIGEST"
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Install by digest: `%s@%s`\n' "$IMAGE" "$DIGEST"
          } > notes.md

          # gh creates the tag at this commit as part of publishing, which
          # keeps tag and release from ever disagreeing about what shipped.
          gh release create "$VERSION" release.json \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md
