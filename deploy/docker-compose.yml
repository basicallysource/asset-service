# The service, its data volume, and nothing else.
#
# Two files configure a deployment and they are deliberately separate:
#   .env in this directory  -- which image to run. The release agent owns it
#                              and rewrites it on every install.
#   the env_file below      -- how the service runs: bucket, keys, limits.
#                              Operators own it; releases never touch it.
services:
  asset-service:
    image: ${ASSET_SERVICE_IMAGE:?ASSET_SERVICE_IMAGE is not set -- the release agent writes it into .env}
    restart: unless-stopped
    env_file:
      - ${ASSET_SERVICE_ENV_FILE:-/etc/asset-service/asset-service.env}
    volumes:
      # The catalog and the upload spool. Must be writable by uid 65532, the
      # nonroot user the image runs as.
      - ${ASSET_SERVICE_DATA:-/var/lib/asset-service}:/data
    ports:
      # Bound to loopback: a reverse proxy on the host publishes it. Change to
      # "8080:8080" only if this service is the thing facing the internet.
      - "127.0.0.1:${ASSET_SERVICE_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Inert unless a Traefik on this host is configured to look. Hosts that
      # route some other way can ignore these or delete them.
      traefik.enable: "${ASSET_SERVICE_TRAEFIK:-false}"
      traefik.http.routers.asset-service.rule: "Host(`${ASSET_SERVICE_HOST:-assets.example.com}`)"
      traefik.http.routers.asset-service.entrypoints: "websecure"
      traefik.http.routers.asset-service.tls.certresolver: "${ASSET_SERVICE_CERT_RESOLVER:-default}"
      traefik.http.services.asset-service.loadbalancer.server.port: "8080"
